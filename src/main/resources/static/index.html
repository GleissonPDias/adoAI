<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#09090B">
    <meta name="description" content="AdoAI — assistente inteligente especializado em mangás e animes, powered by Gemini.">
    <title>AdoAI — Assistente de Mangás e Animes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app-shell">

    <aside class="sidebar" id="sidebar" aria-label="Navegação de conversas">
        <div class="sidebar-brand">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/>
                    <path d="M20 3v4M22 5h-4M4 17v2M5 18H3"/>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">Ado<span>AI</span></span>
                <span class="brand-tag">Mangá &amp; Anime Intelligence</span>
            </div>
            <button class="icon-btn sidebar-close" id="closeSidebarBtn" type="button" aria-label="Fechar menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
            </button>
        </div>

        <button class="new-chat" id="newChatBtn" type="button">
            <svg class="new-chat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
            <span>Nova conversa</span>
            <span class="new-chat-shortcut">⌘ K</span>
        </button>

        <div class="sidebar-section">
            <span>Suas conversas</span>
            <span class="chat-count" id="chatCount">0</span>
        </div>

        <nav class="chat-list" id="chatList" aria-label="Histórico de conversas"></nav>

        <div class="sidebar-footer">
            <div class="footer-status"><span class="status-dot"></span> Sistema operacional</div>
            <div class="footer-note">AdoAI <span>·</span> IA generativa (Gemini)</div>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay" aria-hidden="true"></div>

    <main class="main">
        <header class="topbar">
            <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Abrir menu">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>

            <div class="assistant-identity">
                <div class="assistant-avatar" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 15.5a2 2 0 0 0-1.4-1.4l-6.1-1.6a.5.5 0 0 1 0-1l6.1-1.6a2 2 0 0 0 1.4-1.4l1.6-6.1a.5.5 0 0 1 1 0l1.6 6.1a2 2 0 0 0 1.4 1.4l6.1 1.6a.5.5 0 0 1 0 1l-6.1 1.6a2 2 0 0 0-1.4 1.4l-1.6 6.1a.5.5 0 0 1-1 0z"/><path d="M20 3v4M22 5h-4"/></svg>
                </div>
                <div class="assistant-meta">
                    <span class="assistant-name">AdoAI</span>
                    <span class="assistant-sub">Assistente de Mangás e Animes</span>
                </div>
            </div>

            <div class="header-right">
                <span class="badge">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M21 19h-4"/></svg>
                    Especialista em Mangás e Animes
                </span>
                <span class="online-status"><span class="status-dot"></span> Online</span>
            </div>
        </header>

        <section class="conversation" id="messages" aria-live="polite" aria-label="Conversa"></section>

        <footer class="composer-area">
            <div class="composer-wrap">
                <form class="composer" id="composerForm">
                    <textarea id="messageInput" rows="1" placeholder="Pergunte sobre personagens, poderes, universos..." aria-label="Sua mensagem" maxlength="2000" minlength="1"></textarea>
                    <button class="send-btn" id="sendBtn" type="submit" aria-label="Enviar mensagem">
                        <svg class="send-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                        <span class="send-spinner" aria-hidden="true"></span>
                    </button>
                </form>
                <div class="composer-hint">Pressione <kbd>Enter</kbd> para enviar <span>·</span> <kbd>Shift</kbd> + <kbd>Enter</kbd> para nova linha</div>
            </div>
        </footer>
    </main>
</div>

<template id="heroTemplate">
    <div class="hero">
        <div class="hero-glyph" aria-hidden="true">幻</div>
        <div class="hero-glow" aria-hidden="true"></div>
        <div class="hero-content">
            <span class="hero-eyebrow">アドアイ <span>·</span> IA GENERATIVA</span>
            <span class="hero-badge">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 17v4M21 19h-4"/></svg>
                Powered by Gemini
            </span>
            <h1>Assistente de <span>Mangás e Animes</span></h1>
            <p>Pergunte sobre personagens, poderes, histórias, universos, teorias e recomendações.</p>

            <div class="suggestions" aria-label="Sugestões de perguntas">
                <button class="suggestion" type="button" data-message="Quem é Gojo Satoru?">
                    <span class="suggestion-icon">🔥</span>
                    <span class="suggestion-label">Quem é Gojo Satoru?</span>
                    <svg class="suggestion-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <button class="suggestion" type="button" data-message="Explique o Gear 5">
                    <span class="suggestion-icon">⚔️</span>
                    <span class="suggestion-label">Explique o Gear 5</span>
                    <svg class="suggestion-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <button class="suggestion" type="button" data-message="Quais são os melhores animes da história?">
                    <span class="suggestion-icon">👑</span>
                    <span class="suggestion-label">Melhores animes da história</span>
                    <svg class="suggestion-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <button class="suggestion" type="button" data-message="Quais mangás são parecidos com Berserk?">
                    <span class="suggestion-icon">📚</span>
                    <span class="suggestion-label">Mangás parecidos com Berserk</span>
                    <svg class="suggestion-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
                <button class="suggestion" type="button" data-message="Explique o universo de Evangelion">
                    <span class="suggestion-icon">🌌</span>
                    <span class="suggestion-label">Universo Evangelion</span>
                    <svg class="suggestion-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </div>
        </div>
    </div>
</template>

<script src="/app.js"></script>
</body>
</html>
